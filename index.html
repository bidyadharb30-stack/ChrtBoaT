<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0a14" />
  <title>CoupleSync — Private Couple Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top right, #23112b, #0f0a14 65%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
    }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.09); }
    .msg-me { background: linear-gradient(135deg, #f43f5e, #ec4899); border-radius: 18px 18px 4px 18px; }
    .msg-partner { background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px 18px 18px 4px; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(244, 63, 94, 0.4); border-radius: 10px; }
  </style>
</head>
<body class="flex flex-col select-none">

  <!-- Toast Banner -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[92%] max-w-sm pointer-events-none"></div>

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="flex-1 flex flex-col justify-center items-center p-5 overflow-y-auto">
    <div class="glass w-full max-w-md rounded-3xl p-6 shadow-2xl border border-rose-500/20">
      <div class="flex flex-col items-center text-center mb-5">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center shadow-lg shadow-rose-500/30 mb-3 text-3xl">
          ❤️
        </div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-rose-300 via-pink-300 to-purple-300 bg-clip-text text-transparent">
          CoupleSync
        </h1>
        <p class="text-xs text-slate-400 mt-1">Sirf tum dono ke liye — Private & Real-time ❤️</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">1. Apna Role Chuno</label>
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="selectRole('partner1')" id="role-partner1"
              class="role-btn p-3 rounded-2xl border border-rose-500 bg-rose-500/20 text-center transition">
              <div class="text-lg mb-0.5">🤴</div>
              <div class="text-sm font-semibold text-white">Partner 1</div>
              <div class="text-[11px] text-rose-200">Me / Boyfriend</div>
            </button>
            <button type="button" onclick="selectRole('partner2')" id="role-partner2"
              class="role-btn p-3 rounded-2xl border border-white/10 bg-white/5 text-center transition">
              <div class="text-lg mb-0.5">👸</div>
              <div class="text-sm font-semibold text-white">Partner 2</div>
              <div class="text-[11px] text-slate-400">Girlfriend / Love</div>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">2. Pyara Sa Naam</label>
          <input id="input-name" type="text" maxlength="20" placeholder="Jaise: Jaan, Babu, My Love..."
            class="w-full px-4 py-3 rounded-2xl bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 text-sm" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">3. Secret Couple Code</label>
          <div class="flex gap-2">
            <input id="input-room" type="text" maxlength="24" placeholder="Dono ka same secret code"
              class="flex-1 px-4 py-3 rounded-2xl bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 text-sm font-mono" />
            <button type="button" onclick="copyRoomCode()"
              class="px-3.5 py-3 rounded-2xl bg-white/10 active:bg-white/20 text-slate-200 text-xs font-medium">
              Copy
            </button>
          </div>
          <p class="text-[11px] text-slate-400 mt-1.5">Dono ko bilkul same code daalna hai.</p>
        </div>

        <button type="button" id="join-btn" onclick="joinRoom()"
          class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 font-semibold text-white shadow-lg shadow-rose-500/30 active:scale-[0.98] transition">
          Start Private Chat 💬
        </button>
      </div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen" class="hidden flex-1 flex flex-col max-w-2xl w-full mx-auto h-full">
    <header class="glass px-4 py-3 flex items-center justify-between border-b border-white/10 z-20">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div id="partner-avatar" class="w-11 h-11 rounded-full bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center font-bold text-lg text-white">
            ❤️
          </div>
          <span id="partner-status-dot" class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-slate-500 border-2 border-[#160d1f]"></span>
        </div>
        <div>
          <h2 id="partner-display-name" class="font-bold text-base text-white leading-tight">Partner</h2>
          <p id="partner-status-text" class="text-xs text-slate-400">Offline</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleSound()" id="sound-btn" class="px-2.5 py-2 rounded-xl bg-white/5 text-sm">🔔</button>
        <button onclick="leaveRoom()" class="px-2.5 py-2 rounded-xl bg-white/5 text-xs text-rose-300">Exit</button>
      </div>
    </header>

    <main id="messages-box" class="flex-1 overflow-y-auto p-4 space-y-3 select-text">
      <div class="text-center my-4">
        <span class="px-3 py-1 rounded-full bg-white/5 text-[11px] text-slate-400 border border-white/5">
          🔒 End-to-End Private Couple Room
        </span>
      </div>
    </main>

    <div id="typing-bar" class="hidden px-5 py-1 text-xs text-pink-300 italic">
      Partner is typing...
    </div>

    <!-- Emoji Drawer -->
    <div id="emoji-drawer" class="hidden glass mx-3 mb-2 p-3 rounded-2xl border border-white/10">
      <div id="emoji-grid" class="grid grid-cols-8 gap-1.5 text-2xl text-center"></div>
    </div>

    <!-- Input Bar -->
    <footer class="glass p-3 border-t border-white/10">
      <form onsubmit="sendMessage(event)" class="flex items-center gap-2">
        <button type="button" onclick="toggleEmojiDrawer()" class="p-2.5 rounded-xl bg-white/5 text-xl">😊</button>
        <input id="msg-input" type="text" autocomplete="off" placeholder="Message likho..." oninput="handleTyping()"
          class="flex-1 px-4 py-3 rounded-2xl bg-white/5 border border-white/10 text-white placeholder-slate-400 focus:outline-none focus:border-rose-500 text-sm" />
        <button type="button" onclick="sendQuickHeart()" class="p-2.5 rounded-xl bg-rose-500/20 text-lg">❤️</button>
        <button type="submit" class="px-4 py-3 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-semibold text-sm">Send</button>
      </form>
    </footer>
  </div>

  <!-- Firebase Realtime Database SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase, ref, set, push, onValue, update, onDisconnect, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAO4d7buesryQB9Y63D4lTGlFox0_Z2gBE",
      authDomain: "chartboat69.firebaseapp.com",
      databaseURL: "https://chartboat69-default-rtdb.firebaseio.com",
      projectId: "chartboat69",
      storageBucket: "chartboat69.firebasestorage.app",
      messagingSenderId: "1076666702816",
      appId: "1:1076666702816:web:0f9a135be5610bcf676985"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let selectedRole = localStorage.getItem("cs_role") || "partner1";
    let myName = localStorage.getItem("cs_name") || "";
    let roomCode = localStorage.getItem("cs_room") || "";
    let soundEnabled = true;
    let lastPartnerOnline = null;
    let initialLoadDone = false;
    let lastMsgCount = 0;
    let typingTimeout = null;

    const emojis = ["❤️","😘","🥰","😍","💕","💖","💋","🤗","🥺","😭","😂","🙈","🌹","✨","🔥","🍫","💍","🫶","😴","😤","🎉","🤍","💓","💞"];

    document.getElementById("input-name").value = myName;
    document.getElementById("input-room").value = roomCode;
    selectRole(selectedRole);

    const grid = document.getElementById("emoji-grid");
    emojis.forEach(em => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = em;
      b.className = "p-1 rounded-lg active:bg-white/15";
      b.onclick = () => {
        const inp = document.getElementById("msg-input");
        inp.value += em;
        inp.focus();
      };
      grid.appendChild(b);
    });

    window.selectRole = (role) => {
      selectedRole = role;
      document.querySelectorAll(".role-btn").forEach(el => {
        el.classList.remove("border-rose-500", "bg-rose-500/20");
        el.classList.add("border-white/10", "bg-white/5");
      });
      const active = document.getElementById("role-" + role);
      active.classList.remove("border-white/10", "bg-white/5");
      active.classList.add("border-rose-500", "bg-rose-500/20");
    };

    window.copyRoomCode = () => {
      const code = document.getElementById("input-room").value.trim();
      if (!code) return showToast("Pehle code likho!");
      navigator.clipboard?.writeText(code);
      showToast("Secret code copy ho gaya!");
    };

    window.toggleEmojiDrawer = () => {
      document.getElementById("emoji-drawer").classList.toggle("hidden");
    };

    window.toggleSound = () => {
      soundEnabled = !soundEnabled;
      document.getElementById("sound-btn").textContent = soundEnabled ? "🔔" : "🔕";
      showToast(soundEnabled ? "Sound On" : "Sound Muted");
    };

    function playBeep(type) {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = type === "online" ? 880 : type === "offline" ? 440 : 660;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    function showToast(text) {
      const box = document.getElementById("toast-container");
      const el = document.createElement("div");
      el.className = "glass px-4 py-3 rounded-2xl text-xs font-medium text-white shadow-xl border border-rose-500/30 text-center";
      el.textContent = text;
      box.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    window.joinRoom = () => {
      myName = document.getElementById("input-name").value.trim();
      roomCode = document.getElementById("input-room").value.trim().replace(/[.#$/[\]]/g, "_");
      if (!myName || !roomCode) return showToast("Naam aur Secret Code dono bharo!");

      localStorage.setItem("cs_role", selectedRole);
      localStorage.setItem("cs_name", myName);
      localStorage.setItem("cs_room", roomCode);

      document.getElementById("setup-screen").classList.add("hidden");
      document.getElementById("chat-screen").classList.remove("hidden");

      startSession();
    };

    window.leaveRoom = () => {
      const myPresenceRef = ref(db, `rooms/${roomCode}/presence/${selectedRole}`);
      update(myPresenceRef, { online: false, lastSeen: Date.now() });
      document.getElementById("chat-screen").classList.add("hidden");
      document.getElementById("setup-screen").classList.remove("hidden");
    };

    function startSession() {
      const partnerRole = selectedRole === "partner1" ? "partner2" : "partner1";
      const myPresenceRef = ref(db, `rooms/${roomCode}/presence/${selectedRole}`);
      const partnerPresenceRef = ref(db, `rooms/${roomCode}/presence/${partnerRole}`);
      const messagesRef = ref(db, `rooms/${roomCode}/messages`);

      // Set Online + Auto Offline on Disconnect
      const connectedRef = ref(db, ".info/connected");
      onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
          onDisconnect(myPresenceRef).set({
            name: myName,
            online: false,
            typing: false,
            lastSeen: Date.now()
          });
          set(myPresenceRef, {
            name: myName,
            online: true,
            typing: false,
            lastSeen: Date.now()
          });
        }
      });

      // Listen Partner Online/Offline & Typing
      onValue(partnerPresenceRef, (snap) => {
        const data = snap.val();
        if (!data) return;

        const pName = data.name || "Partner";
        document.getElementById("partner-display-name").textContent = pName;
        document.getElementById("partner-avatar").textContent = pName.charAt(0).toUpperCase();

        const dot = document.getElementById("partner-status-dot");
        const statusText = document.getElementById("partner-status-text");
        const typingBar = document.getElementById("typing-bar");

        if (data.online) {
          dot.className = "absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-emerald-400 border-2 border-[#160d1f]";
          statusText.textContent = "Online now";
          statusText.className = "text-xs text-emerald-400 font-medium";
        } else {
          dot.className = "absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-slate-500 border-2 border-[#160d1f]";
          const timeStr = data.lastSeen ? new Date(data.lastSeen).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "recently";
          statusText.textContent = `Last seen ${timeStr}`;
          statusText.className = "text-xs text-slate-400";
        }

        if (data.typing && data.online) {
          typingBar.textContent = `${pName} is typing...`;
          typingBar.classList.remove("hidden");
        } else {
          typingBar.classList.add("hidden");
        }

        // Notify when Partner comes Online or goes Offline
        if (lastPartnerOnline !== null && lastPartnerOnline !== data.online) {
          if (data.online) {
            playBeep("online");
            showToast(`💚 ${pName} abhi Online aaya hai!`);
          } else {
            playBeep("offline");
            showToast(`⚪ ${pName} Offline chala gaya`);
          }
        }
        lastPartnerOnline = data.online;
      });

      // Listen Messages
      onValue(messagesRef, (snap) => {
        const val = snap.val() || {};
        const list = Object.entries(val).map(([id, m]) => ({ id, ...m }));
        renderMessages(list);

        if (initialLoadDone && list.length > lastMsgCount) {
          const latest = list[list.length - 1];
          if (latest && latest.sender !== selectedRole) {
            playBeep("msg");
            showToast(`💌 ${latest.senderName || "Partner"}: ${latest.text}`);
          }
        }
        lastMsgCount = list.length;
        initialLoadDone = true;
      });
    }

    function renderMessages(list) {
      const box = document.getElementById("messages-box");
      box.innerHTML = `<div class="text-center my-3"><span class="px-3 py-1 rounded-full bg-white/5 text-[11px] text-slate-400">🔒 Private Couple Room: ${roomCode}</span></div>`;

      list.forEach(m => {
        const isMe = m.sender === selectedRole;
        const time = m.ts ? new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
        const wrap = document.createElement("div");
        wrap.className = `flex flex-col ${isMe ? "items-end" : "items-start"}`;

        const bubble = document.createElement("div");
        bubble.className = `${isMe ? "msg-me" : "msg-partner"} px-4 py-2.5 max-w-[78%] text-sm text-white shadow relative cursor-pointer`;
        bubble.ondblclick = () => toggleHeart(m.id, m.liked);
        bubble.innerHTML = `
          <div class="break-words">${escapeHtml(m.text)}</div>
          <div class="text-[10px] opacity-70 mt-1 text-right">${time} ${m.liked ? "❤️" : ""}</div>
        `;
        wrap.appendChild(bubble);
        box.appendChild(wrap);
      });
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
    }

    window.toggleHeart = (msgId, currentLiked) => {
      update(ref(db, `rooms/${roomCode}/messages/${msgId}`), { liked: !currentLiked });
    };

    window.sendMessage = (e) => {
      e.preventDefault();
      const inp = document.getElementById("msg-input");
      const text = inp.value.trim();
      if (!text) return;
      inp.value = "";
      document.getElementById("emoji-drawer").classList.add("hidden");

      push(ref(db, `rooms/${roomCode}/messages`), {
        sender: selectedRole,
        senderName: myName,
        text,
        ts: Date.now(),
        liked: false
      });

      update(ref(db, `rooms/${roomCode}/presence/${selectedRole}`), { typing: false });
    };

    window.sendQuickHeart = () => {
      push(ref(db, `rooms/${roomCode}/messages`), {
        sender: selectedRole,
        senderName: myName,
        text: "❤️",
        ts: Date.now(),
        liked: false
      });
    };

    window.handleTyping = () => {
      const myRef = ref(db, `rooms/${roomCode}/presence/${selectedRole}`);
      update(myRef, { typing: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        update(myRef, { typing: false });
      }, 1500);
    };
  </script>
</body>
</html>
